name: Release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact project version without the v prefix
        required: true
        default: 0.1.0
        type: string
      create_draft:
        description: Create a GitHub draft after all updater-signed artifacts pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  validate:
    name: Fail-closed release validation
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - name: Match requested version
        shell: bash
        run: |
          test "$(bun -p 'require("./package.json").version')" = "$RELEASE_VERSION"
      - run: bun scripts/verify-versions.ts
      - name: Require production manifest, public updater key, and private signer
        run: bun scripts/check-release-config.ts --release
      - name: Validate production manifest with the canonical Rust contract
        run: cargo run --locked -p claude-zhcn-cli -- validate-manifest resources/supported-release.json

  build:
    name: Updater-signed build (${{ matrix.updater_platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            updater_platform: darwin-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
            updater_platform: darwin-x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            updater_platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          target: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Build native installer and updater-signed archive
        run: >-
          bun run tauri build
          --config src-tauri/tauri.release.conf.json
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
      - name: Normalize platform assets
        run: >-
          bun scripts/collect-release-assets.ts
          ${{ matrix.target }}
          target/${{ matrix.target }}/release/bundle
          release-staging
      - uses: actions/upload-artifact@v4
        with:
          name: updater-signed-${{ matrix.updater_platform }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble complete updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          pattern: updater-signed-*
          path: release-assets
          merge-multiple: true
      - name: Require all three updater-signed targets in one latest.json
        run: bun scripts/assemble-updater-manifest.ts release-assets release-assets/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-v${{ inputs.version }}
          path: |
            release-assets/*
            !release-assets/*.metadata.json
          if-no-files-found: error
          retention-days: 7

  create-draft:
    name: Create GitHub draft
    if: ${{ inputs.create_draft }}
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle-v${{ inputs.version }}
          path: release-assets
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Updater-signed three-platform draft. Apple notarization and Windows Authenticode are not configured; publish only after native acceptance." \
            --draft
